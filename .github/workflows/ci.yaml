name: CI
on:
  - pull_request
  - push
  - workflow_dispatch


env:
  JDK_VERSION: "23"


jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Development Environment
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Launcher
        run: |
          pushd .
          cd launcher
          cargo build --release
          popd

      - name: Build with Gradle
        run: ./gradlew build bundle --info -S --show-version

      - name: Build Installer
        run: |
          pushd .
          msbuild /p:Configuration=Release /p:Platform=x64 /t:Rebuild
          popd

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: "./installer/bin/x64/Release/GW2AddonManager.msi"

      - name: Upload Portable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: "./build/bundles/GW2AddonManager-2.0.0.zip" # TODO Figure out how to handle the version